      toggleSeo: () => this.setState({ seoOpen: !seoOpen }),

      faq: p.faq.map((f, i) => ({
        q: f.q, paras: f.paras, open: faq === i, sign: faq === i ? '×' : '+',
        go: () => this.setState({ faq: faq === i ? -1 : i }),
      })),
    };
  }
}

</script>
</body>
</html>
