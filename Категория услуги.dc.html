<template data-dc-source><x-dc>
<helmet>






<style>
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Black.woff2") format("woff2");font-weight:900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
::selection{background:#00AD9F;color:#fff}
.category-rates__header,.category-rates__row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 130px;gap:clamp(10px,1.4cqw,22px);align-items:center}
.category-rates__row>span{min-width:0}
.category-rates__label{display:none}
@media(max-width:640px){
 .category-rates__header{display:none}
 .category-rates__row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 12px;padding:20px 0}
 .category-rates__title,.category-rates__cta{grid-column:1/-1}
 .category-rates__label{display:block;margin-bottom:6px;color:#929292;font-size:12px;font-weight:400}
 .category-rates__row>span{white-space:normal}
 .category-rates__cta{justify-self:start;min-height:44px}
}
</style>

<div data-service-section="{{ sectionKey }}" style="container-type:inline-size;position:relative;font-family:TildaSans,'Helvetica Neue',Helvetica,sans-serif;color:#313131;background:#fff;overflow:clip">

  <dc-import name="Шапка" variant="{{ headerVariant }}" hint-size="100%,122px"></dc-import>

  <div style="background:#fff;border-bottom:1px solid #f0f0f0">
    <div style="max-width:1240px;margin:0 auto;padding:16px clamp(16px,1.4cqw,20px);display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <a href="/" style="font-size:12px;color:#929292;text-decoration:none" style-hover="color:#00AD9F">Главная</a>
      <span style="font-size:12px;color:#bfbfbf">/</span>
      <a href="{{ p.parentHref }}" style="font-size:12px;color:#929292;text-decoration:none" style-hover="color:#00AD9F">{{ p.parent }}</a>
      <span style="font-size:12px;color:#bfbfbf">/</span>
      <sc-if value="{{ p.groupHref }}" hint-placeholder-val="{{ false }}">
        <a href="{{ p.groupHref }}" style="font-size:12px;color:#929292;text-decoration:none" style-hover="color:#00AD9F">{{ p.groupTitle }}</a>
        <span style="font-size:12px;color:#bfbfbf">/</span>
      </sc-if>
      <span style="font-size:12px;color:#5c5c5c">{{ p.crumb }}</span>
    </div>
  </div>

  <section data-screen-label="Обложка категории" style="position:relative;background:#313131">
    <sc-if value="{{ p.hero }}" hint-placeholder-val="{{ false }}">
      <div role="img" aria-label="{{ p.h1 }}" style="{{ heroImageCss }}"></div>
    </sc-if>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,20,.74) 0%,rgba(20,20,20,.52) 55%,rgba(20,20,20,.3) 100%)"></div>
    <div style="position:relative;max-width:1200px;margin:0 auto;padding:clamp(36px,4cqw,64px) clamp(16px,1.4cqw,20px) clamp(40px,4.4cqw,70px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,3cqw,44px);align-items:center;min-height:clamp(400px,31cqw,470px)">
      <div style="display:flex;flex-direction:column;gap:clamp(15px,1.5cqw,22px);min-width:0">
        <h1 style="margin:0;font-size:clamp(25px,3.4cqw,48px);line-height:1.04;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;color:#fff">{{ p.h1 }}</h1>
        <sc-if value="{{ p.price }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:clamp(17px,1.8cqw,26px);font-weight:600;color:#00AD9F;line-height:1.15">от {{ p.price }} рублей за м²</div>
        </sc-if>
        <div style="font-size:clamp(13px,1.25cqw,17px);line-height:1.55;color:#fff;max-width:520px;display:flex;flex-direction:column;gap:4px">
          <sc-for list="{{ p.bullets }}" as="b" hint-placeholder-count="3">
            <span>{{ b }}</span>
          </sc-for>
        </div>
        <sc-if value="{{ p.price }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:11px;color:#d9d9d9;letter-spacing:.02em">Цена «от» указана за квадратный метр по полу</div>
        </sc-if>
        <button type="button" onClick="{{ openPopup }}" style="align-self:flex-start;background:#00AD9F;color:#fff;border:0;border-radius:5px;padding:17px 26px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,box-shadow .2s;margin-top:4px;min-height:48px;line-height:1.3" style-hover="background:#026B63;box-shadow:0 8px 22px rgba(0,0,0,.35);color:#fff">{{ p.cta }}</button>
      </div>
      <div style="min-width:0;display:flex;justify-content:flex-end">
        <div id="quiz" style="scroll-margin-top:160px;width:100%;max-width:500px;border-radius:5px;overflow:hidden;background:#fff">
          <sc-if value="{{ isAcceptance }}" hint-placeholder-val="{{ false }}">
            <dc-import name="Форма" kind="Приёмка" state="Пустая" hint-size="100%,620px"></dc-import>
          </sc-if>
          <sc-if value="{{ isSimpleService }}" hint-placeholder-val="{{ false }}">
            <dc-import name="Форма" kind="Встроенная" state="Пустая" title="{{ p.formTitle }}" cta="{{ p.cta }}" perks="{{ p.popupPerks }}" hint-size="100%,620px"></dc-import>
          </sc-if>
          <sc-if value="{{ hasQuiz }}" hint-placeholder-val="{{ true }}">
            <dc-import name="Квиз" key="{{ quizKind }}" kind="{{ quizKind }}" hint-size="100%,620px"></dc-import>
          </sc-if>
        </div>
      </div>
    </div>
  </section>

  <section data-screen-label="Вводный текст" style="background:#fff;padding:clamp(40px,4.8cqw,78px) 0 clamp(26px,3cqw,46px)">
    <div style="{{ leadGridCss }}">
      <div style="min-width:0;display:flex;flex-direction:column;gap:16px">
        <h2 style="margin:0;font-size:clamp(20px,2.2cqw,30px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">{{ p.leadTitle }}</h2>
        <p style="margin:0;font-size:clamp(16px,1.4cqw,20px);line-height:1.65;color:#5c5c5c;max-width:560px;text-wrap:pretty">{{ p.lead }}</p>
      </div>
      <sc-if value="{{ hasFacts }}" hint-placeholder-val="{{ true }}">
       <div style="min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:clamp(14px,1.6cqw,22px)">
        <sc-for list="{{ p.facts }}" as="f" hint-placeholder-count="4">
          <div style="background:#f8f8f8;padding:clamp(16px,1.6cqw,22px);display:flex;flex-direction:column;gap:6px;min-width:0">
            <div style="font-size:clamp(19px,2cqw,28px);font-weight:600;line-height:1;color:#00AD9F;font-variant-numeric:tabular-nums">{{ f.v }}</div>
            <div style="font-size:11.5px;line-height:1.45;color:#5c5c5c">{{ f.t }}</div>
          </div>
        </sc-for>
       </div>
      </sc-if>
    </div>
  </section>

  <section data-screen-label="Что входит" style="background:#f8f8f8;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px)">
      <h2 style="margin:0;font-size:clamp(28px,3cqw,42px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">{{ p.includesTitle }}</h2>
      <div style="margin-top:clamp(24px,2.6cqw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(16px,1.8cqw,26px);align-items:start">
        <sc-for list="{{ p.includes }}" as="g" hint-placeholder-count="3">
          <div style="background:#fff;padding:clamp(20px,2cqw,26px);display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.05)">
            <h3 style="margin:0;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#00AD9F">{{ g.title }}</h3>
            <div style="display:flex;flex-direction:column;gap:10px">
              <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="6">
                <div style="display:flex;gap:10px;align-items:flex-start">
                  <span style="flex:0 0 auto;font-size:13px;line-height:1.4;color:#00AD9F;font-weight:700">✓</span>
                  <span style="font-size:13px;line-height:1.4;color:#313131">{{ i }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section data-screen-label="Цена и сроки" style="background:#fff;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px)">
      <h2 style="margin:0;font-size:clamp(28px,3cqw,42px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">Цена и сроки</h2>
      <div style="margin-top:clamp(22px,2.4cqw,36px);display:flex;flex-direction:column">
        <div class="category-rates__header" style="padding:0 0 12px;border-bottom:2px solid #313131">
          <span style="font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#929292">{{ p.rateLabel }}</span>
          <span style="font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#929292">Цена</span>
          <span style="font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#929292">Срок</span>
          <span></span>
        </div>
        <sc-for list="{{ p.rates }}" as="r" hint-placeholder-count="4">
          <div class="category-rates__row" style="padding:16px 0;border-bottom:1px solid #ededed">
            <span class="category-rates__title" style="font-size:16px;font-weight:600;color:#313131;line-height:1.3">{{ r.title }}</span>
            <span style="font-size:16px;font-weight:400;color:#026B63;font-variant-numeric:tabular-nums"><span class="category-rates__label">Цена</span>{{ r.price }}</span>
            <span style="font-size:16px;color:#5c5c5c"><span class="category-rates__label">Срок</span>{{ r.term }}</span>
            <button class="category-rates__cta" type="button" onClick="{{ openPopup }}" style="background:transparent;color:#00AD9F;border:1px solid #00AD9F;border-radius:5px;padding:11px 18px;font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;transition:all .2s;min-height:48px;line-height:1.3" style-hover="background:#00AD9F;color:#fff">Рассчитать</button>
          </div>
        </sc-for>
      </div>
      <div style="margin-top:16px;font-size:11.5px;line-height:1.55;color:#929292;max-width:720px">{{ p.rateNote }}</div>
    </div>
  </section>

  <sc-if value="{{ hasWorks }}" hint-placeholder-val="{{ true }}">
   <section data-screen-label="Примеры работ" style="background:#f8f8f8;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px)">
      <h2 style="margin:0;font-size:clamp(28px,3cqw,42px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">{{ p.worksTitle }}</h2>
      <div style="margin-top:clamp(24px,2.6cqw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(16px,1.7cqw,26px)">
        <sc-for list="{{ works }}" as="w" hint-placeholder-count="4">
          <a href="/portfolio/" style="text-decoration:none;display:flex;flex-direction:column;gap:12px;min-width:0">
            <div role="img" aria-label="{{ w.title }}" style="{{ w.imageCss }}" style-hover="opacity:.9"></div>
            <span style="font-size:clamp(11.5px,.95cqw,13px);font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#5c5c5c;line-height:1.35">{{ w.title }}</span>
          </a>
        </sc-for>
      </div>
    </div>
   </section>
  </sc-if>

  <sc-if value="{{ hasSeo }}" hint-placeholder-val="{{ true }}">
   <section data-screen-label="SEO-текст" style="background:#fff;padding:0 0 clamp(44px,5.6cqw,92px)">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px);display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:clamp(20px,2.2cqw,30px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">{{ p.seoTitle }}</h2>
      <div style="{{ seoBoxCss }}">
        <sc-for list="{{ seoParas }}" as="t" hint-placeholder-count="2">
          <p style="margin:0 0 14px;font-size:clamp(16px,1.4cqw,20px);line-height:1.7;color:#5c5c5c;text-wrap:pretty">{{ t }}</p>
        </sc-for>
        <sc-if value="{{ seoFade }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)"></div>
        </sc-if>
      </div>
      <button type="button" onClick="{{ toggleSeo }}" style="align-self:flex-start;background:transparent;border:1px solid #00AD9F;color:#00AD9F;padding:13px 22px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:all .2s;min-height:48px;line-height:1.3" style-hover="background:#00AD9F;color:#fff">{{ seoLabel }}</button>
    </div>
   </section>
  </sc-if>

  <section data-screen-label="Вопрос-ответ" style="background:#f8f8f8;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px)">
      <h2 style="margin:0;font-size:clamp(28px,3cqw,42px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">Вопрос-ответ</h2>
      <div style="margin-top:clamp(22px,2.4cqw,38px);max-width:780px;display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ faq }}" as="f" hint-placeholder-count="4">
          <div style="background:#00AD9F">
            <button type="button" onClick="{{ f.go }}" style="width:100%;border:0;background:transparent;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left">
              <span style="font-size:clamp(16px,1.4cqw,20px);font-weight:600;color:#fff;line-height:1.35">{{ f.q }}</span>
              <span style="flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#fff;color:#00AD9F;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1">{{ f.sign }}</span>
            </button>
            <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
              <div style="padding:0 20px 22px;display:flex;flex-direction:column;gap:10px">
                <sc-for list="{{ f.paras }}" as="t" hint-placeholder-count="1">
                  <p style="margin:0;font-size:17px;line-height:1.5;color:#fff">{{ t }}</p>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section data-screen-label="Соседние кластеры" style="background:#fff;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px)">
      <h2 style="margin:0;font-size:clamp(20px,2.2cqw,30px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">{{ p.siblingsTitle }}</h2>
      <div style="margin-top:clamp(20px,2.2cqw,32px);display:flex;flex-wrap:wrap;gap:10px">
        <sc-for list="{{ p.siblings }}" as="s" hint-placeholder-count="8">
          <a data-button-link="true" href="{{ s.href }}" style="border:1px solid #e2e2e2;padding:12px 18px;font-size:16px;line-height:1.2;color:#313131;text-decoration:none;transition:all .15s;min-height:48px" style-hover="border-color:#00AD9F;color:#00AD9F">{{ s.t }}</a>
        </sc-for>
      </div>
      <a href="{{ p.parentHref }}" style="margin-top:22px;display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#00AD9F" style-hover="color:#026B63">Все услуги раздела «{{ p.parent }}» →</a>
    </div>
  </section>

  <dc-import name="Встреча" kind="{{ meetingKind }}"></dc-import>

  <dc-import name="Подвал" mobile="{{ isMobile }}" hint-size="100%,470px"></dc-import>



</div>

</x-dc></template>

    hero: 'assets/hero-remont.jpg', cta: 'Бесплатный расчёт сметы',
    lead: 'Уточним задачу и объём работ по этой услуге. Стоимость, материалы и порядок выполнения согласуем по вашему объекту.',
    bullets: ['– обсудим задачу по выбранной услуге;', '– уточним объём и условия работ;', '– подготовим индивидуальный расчёт.'],
    includes: [
      { title: 'Задача', items: ['Требуемый результат', 'Особенности объекта'] },
      { title: 'Объём', items: ['Перечень необходимых работ', 'Материалы и оборудование'] },
      { title: 'Согласование', items: ['Расчёт стоимости', 'Порядок и сроки выполнения'] },
    ],
    popupTitle: 'Получите индивидуальный расчёт по услуге',
    popupPerks: ['– консультацию по выбранной услуге', '– обсуждение объёма работ', '– индивидуальный расчёт'],
  },
};

function genericService(family, title) {
  const content = COMMON_CONTENT[family];
  return {
    ...content, h1: title, crumb: title, leadTitle: title, formTitle: content.popupTitle,
    price: '', facts: [], works: [], seo: [],
    includesTitle: family === 'acceptance' ? 'Как проходит приёмка' : 'Что согласуем перед началом',
    rateLabel: 'Услуга', rates: [{ title, price: 'По запросу', term: 'Индивидуально' }],
    rateNote: 'Стоимость и сроки уточняются после согласования задачи и объёма работ.',
    faq: [
      { q: 'Как узнать стоимость?', paras: ['Оставьте заявку и расскажите об объекте. Состав услуги, стоимость и сроки согласуем после уточнения задачи.'] },
      { q: 'Что нужно для первого обсуждения?', paras: ['Сообщите адрес, площадь и состояние объекта, а также желаемый результат. Если есть план или проект, подготовьте его для обсуждения.'] },
    ],
    siblingsTitle: 'Другие услуги раздела',
  };
}

function relatedServices(section, path) {
  const groups = section.groups || [];
  const current = groups.find(g => (g.items || []).some(i => i.href === path));
  const ordered = current ? [current, ...groups.filter(g => g !== current)] : groups;
  const seen = new Set([path, section.href]);
  const siblings = [];
  ordered.forEach(g => {
    (g.items || []).forEach(i => {
      if (seen.has(i.href)) return;
      seen.add(i.href);
      siblings.push({ t: i.t, href: i.href });
    });
  });
  return { siblings: siblings.slice(0, 12), group: current };
}

function serviceContext(props) {
  const family = Object.hasOwn(FAMILIES, props.serviceSection)
    ? props.serviceSection : (PAGE_FAMILIES[props.page] || 'renovation');
  const fallback = FAMILIES[family];
  const section = (window.ESPADA_SERVICE_MENU || []).find(s => s.key === family) || fallback;
  const path = typeof props.servicePath === 'string' && props.servicePath.trim()
    ? props.servicePath.trim() : fallback.path;
  const title = typeof props.serviceTitle === 'string' && props.serviceTitle.trim()
    ? props.serviceTitle.trim() : section.title;
  const detailed = fallback.example && path === fallback.path;
  const source = detailed ? PAGES[fallback.example] : genericService(family, title);
  const { siblings, group } = relatedServices(section, path);
  return { family, p: {
    ...source, servicePath: path,
    parent: props.serviceParentTitle || section.title,
    parentHref: props.serviceParentPath || section.href,
    groupTitle: group && group.title,
    groupHref: group && group.href !== path ? group.href : '',
    siblings,
  } };
}

class Component extends DCLogic {
  state = { faq: 0, seoOpen: false };

  renderVals() {
    const { p, family } = serviceContext(this.props);
    const mobile = !!this.props.mobile;
    const { faq, seoOpen } = this.state;
    return {
      p, sectionKey: family, isMobile: mobile, headerVariant: mobile ? 'mobile' : 'default',
      hasFacts: p.facts.length > 0, hasWorks: p.works.length > 0, hasSeo: p.seo.length > 0,
      leadGridCss: 'max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px);display:grid;grid-template-columns:'
        + (p.facts.length ? 'repeat(auto-fit,minmax(min(100%,320px),1fr))' : 'minmax(0,1fr)')
        + ';gap:clamp(24px,2.8cqw,48px);align-items:start',
      heroImageCss: 'position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center;background-image:url("' + p.hero + '")',
      works: p.works.map(w => ({ ...w, imageCss: 'width:100%;aspect-ratio:1/1;border-radius:5px;display:block;background-size:cover;background-position:center;background-image:url("' + w.img + '");transition:opacity .2s' })),
      isAcceptance: family === 'acceptance', isSimpleService: family === 'services',
      hasQuiz: family === 'renovation' || family === 'design',
      quizKind: family === 'design' ? 'Дизайн-проект' : 'Ремонт',
      meetingKind: family === 'acceptance' ? 'acceptance' : (family === 'design' ? 'design' : 'repair'),
      openPopup: () => window.__espadaOpenPopup({ kind: family === 'acceptance' ? 'Приёмка' : (family === 'design' ? 'Дизайн' : 'Попап'), title: p.popupTitle, cta: p.cta, perks: p.popupPerks }),

      seoParas: seoOpen ? p.seo : p.seo.slice(0, 1),
      seoFade: !seoOpen,
      seoLabel: seoOpen ? 'Свернуть' : 'Читать полностью',
      seoBoxCss: 'position:relative;overflow:hidden;max-height:' + (seoOpen ? 'none' : 'clamp(120px,11cqw,150px)'),
      toggleSeo: () => this.setState({ seoOpen: !seoOpen }),

      faq: p.faq.map((f, i) => ({
        q: f.q, paras: f.paras, open: faq === i, sign: faq === i ? '×' : '+',
        go: () => this.setState({ faq: faq === i ? -1 : i }),
      })),
    };
  }
}

</script>
