const HUB_ICONS = {
  '/inzhenernye-sistemy/': 'M8 8h8v8H8z M12 3v5 M12 16v5 M3 12h5 M16 12h5 M3 5h3v3 M21 5h-3v3 M3 19h3v-3 M21 19h-3v-3',

};

function mergeContinuedGroups(groups) {
  const merged = [];
  groups.forEach(group => {
    if (!group.title && merged.length) merged[merged.length - 1].items.push(...group.items);
    else merged.push({ ...group, items: [...group.items] });
  });
  return merged;
}

class Component extends DCLogic {
  state = { faq: 0 };

  renderVals() {
    const section = this.props.section || 'renovation';
    const variant = this.props.variant || 'links';
    const content = CONTENT[section] || CONTENT.renovation;
    const menu = (window.ESPADA_SERVICE_MENU || []).find(item => item.key === section);
    const path = this.props.servicePath || '';
    const allGroups = menu ? menu.groups : [];
    const groups = mergeContinuedGroups(allGroups);
    const hubGroups = (path && path !== menu?.href ? allGroups.filter(group => group.href === path) : allGroups)
      .map(group => ({ ...group, iconPath: HUB_ICONS[group.href] || HUB_ICONS.other }));
    const activeFaq = this.state.faq;
    return {
      content, groups, hubGroups, sectionKey: section,
      showLinks: variant === 'links',
      showHub: variant === 'hub',
      showSteps: variant === 'steps',
      showFaq: variant === 'faq',
      stepsGridCss: 'margin-top:clamp(26px,2.8cqw,42px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,'
        + (content.steps.length === 4 ? '220px' : '280px') + '),1fr));gap:clamp(18px,2.2cqw,36px)',
      steps: content.steps.map((step, i) => ({ ...step, n: '0' + (i + 1) })),
      faq: content.faq.map((item, i) => ({ ...item, open: activeFaq === i, sign: activeFaq === i ? '×' : '+', go: () => this.setState({ faq: activeFaq === i ? -1 : i }) })),
    };
  }
}
