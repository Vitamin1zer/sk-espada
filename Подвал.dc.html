<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="espada-revision" content="20261127-live-layout">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=20261127-live-layout"></script>
<link rel="stylesheet" href="assets/demo.css?v=20261127-live-layout">
<script src="assets/demo.js?v=20261127-live-layout" defer></script>
</head>
<body>
<template data-dc-source><x-dc>
<helmet>






<style>
.espada-footer-socials{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:38px;margin-top:30px}.espada-footer-socials>div{grid-column:2}@media(max-width:1000px){.espada-footer-socials{display:flex;justify-content:flex-start}}

@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>

<footer style="background:#313131;color:#fff;container-type:inline-size;font-family:TildaSans,'Helvetica Neue',Helvetica,sans-serif">
  <div style="{{ innerCss }}">

    <div style="{{ gridCss }}">

      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <a href="/" title="На главную" style="display:block">
          <img src="assets/logo-full-white.png" alt="Эспада — ремонт и дизайн" style="height:44px;width:auto;display:block" />
        </a>
        <a href="tel:+79938914064" style="font-size:19px;font-weight:800;color:#fff;text-decoration:underline;text-underline-offset:3px;letter-spacing:.01em" style-hover="color:#00AD9F">+7 (993) 891-40-64</a>
        <a href="mailto:sk-espada@rambler.ru" style="font-size:13px;color:#bfbfbf;text-decoration:none" style-hover="color:#00AD9F">sk-espada@rambler.ru</a>
        <div style="font-size:13px;line-height:1.5;color:#bfbfbf">Москва, ул. Дегунинская, д. 1, корп. 2</div>
        <div style="font-size:11.5px;line-height:1.5;color:#8f8f8f;max-width:300px">Режим работы: ежедневно, 9:00 – 18:00</div>
      </div>

      <sc-for list="{{ columns }}" as="c" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;min-width:0">
          <div style="font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#00AD9F;margin-bottom:16px">{{ c.title }}</div>
          <div style="display:flex;flex-direction:column;gap:11px">
            <sc-for list="{{ c.items }}" as="i" hint-placeholder-count="5">
              <a href="{{ i.href }}" style="font-size:12px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:#fff;text-decoration:none;line-height:1.35;transition:color .15s" style-hover="color:#00AD9F">{{ i.t }}</a>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div style="font-size:12px;line-height:1.5;color:#bfbfbf">Нажмите, чтобы наш менеджер связался с вами:</div>
        <form data-lead-type="callback" noValidate="true" onSubmit="{{ callback }}" style="display:flex;flex-direction:column;gap:10px">
          <input type="tel" name="phone" aria-label="Телефон для обратного звонка" autocomplete="tel" value="{{ callbackPhone }}" onChange="{{ changePhone }}" placeholder="+7 (000) 000-00-00" style="height:48px;min-width:0;width:100%;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:0 13px;font-size:16px;color:#313131;background:#fff;outline:none" style-focus="border-color:#00AD9F" />
          <sc-if value="{{ callbackError }}"><span role="alert" style="font-size:13px;color:#ffc6bd;line-height:1.4">Введите номер полностью — 10 цифр после +7</span></sc-if>
          <button type="submit" style="background:#00AD9F;color:#fff;border:0;border-radius:5px;padding:15px 20px;min-height:48px;font-size:16px;font-weight:600;line-height:1.3;transition:background .2s;align-self:flex-start" style-hover="background:#026B63;color:#fff">Заказать звонок</button>
          <sc-if value="{{ callbackSent }}"><span role="status" style="font-size:13px;color:#fff;line-height:1.4">Заявка заполнена. В демонстрации данные не отправляются.</span></sc-if>
          <span style="font-size:11px;line-height:1.45;color:#8f8f8f">Нажимая кнопку, вы даёте <a href="/soglasie-na-obrabotku/" style="color:#fff;text-decoration:underline">согласие на обработку персональных данных</a> в соответствии с <a href="/politika-konfidencialnosti/" style="color:#fff;text-decoration:underline">Политикой конфиденциальности</a></span>
        </form>
      </div>

    </div>

    <div class="espada-footer-socials">
        <div style="display:flex;gap:14px;align-items:center">
          <sc-for list="{{ socials }}" as="s" hint-placeholder-count="3">
            <a href="{{ s.href }}" title="{{ s.name }}" target="_blank" rel="noopener" style="display:block;opacity:.85;transition:opacity .15s" style-hover="opacity:1">
              <img src="{{ s.icon }}" alt="{{ s.name }}" style="width:20px;height:20px;object-fit:contain;display:block" />
            </a>
          </sc-for>
        </div>
    </div>

    <div style="{{ bottomCss }}">
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <div style="font-size:11.5px;line-height:1.55;color:#8f8f8f">Сайт не является публичной офертой и носит информационный характер</div>
        <div style="font-size:11.5px;line-height:1.55;color:#8f8f8f">© 2026 Все права защищены. ИП Ланин Кирилл Андреевич, ИНН 772142258108, ОГРНИП 324774600528604</div>
      </div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
        <a href="/politika-konfidencialnosti/" style="font-size:11.5px;color:#bfbfbf;text-decoration:underline;text-underline-offset:2px" style-hover="color:#00AD9F">Политика конфиденциальности</a>
        <a href="/soglasie-na-obrabotku/" style="font-size:11.5px;color:#bfbfbf;text-decoration:underline;text-underline-offset:2px" style-hover="color:#00AD9F">Согласие на обработку персональных данных</a>
      </div>
    </div>

  </div>
</footer>

</x-dc></template>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:520},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Состояние&quot;}}">
const T = (t, href) => ({ t, href });

const COLUMNS = [
  { title: 'Услуги', items: [
    T('Ремонт квартир', '/remont-kvartir-pod-klyuch/'),
    T('Дизайн интерьера', '/dizajn-interera/'),
    T('Комплектация', '/komplektatsiya-kvartiry/'),
    T('Приёмка квартир', '/priyomka-kvartir-v-novostrojke/'),
    T('Отдельные работы', '/uslugi/'),
    T('Цены', '/remont-kvartir-pod-klyuch/'),
  ] },
  { title: 'Компания', items: [
    T('О компании', '/o-kompanii/'),
    T('Примеры работ', '/portfolio/'),
    T('Отзывы', '/otzyvy/'),
    T('Вопросы и ответы', '/faq/'),
    T('Контакты', '/kontakty/'),
    T('Блог', '/blog/'),
  ] },
  { title: 'Сотрудничество', items: [
    T('Партнёрам', '/partners/'),
    T('Вакансии', 'https://hh.ru/employer/12458493'),
  ] },
];

const SOCIALS = [
  { name: 'Дзен', href: 'https://dzen.ru/espada', icon: 'assets/soc-dzen.png' },
  { name: 'Telegram', href: 'https://t.me/espada_remont', icon: 'assets/soc-tg.png' },
  { name: 'ВКонтакте', href: 'https://vk.com/sk_espada', icon: 'assets/soc-vk.png' },
];

class Component extends DCLogic {
  state = { sent: false, phone: '', attempted: false };
  renderVals() {
    const m = !!this.props.mobile;
    return {
      socials: SOCIALS,
      columns: COLUMNS,
      callbackPhone: this.state.phone,
      callbackSent: this.state.sent,
      callbackError: this.state.attempted && !/^7\d{10}$|^8\d{10}$/.test(this.state.phone.replace(/\D/g,'')),
      changePhone: e => this.setState({ phone: e.target.value, sent: false }),
      callback: e => { e.preventDefault(); this.setState({ attempted: true, sent: /^[78]\d{10}$/.test(this.state.phone.replace(/\D/g,'')) }); },
      innerCss: 'max-width:1240px;margin:0 auto;padding:' + (m ? '36px 16px 28px' : '56px 20px 26px'),
      gridCss: m
        ? 'display:flex;flex-direction:column;gap:34px'
        : 'display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(20px,2.6cqw,38px);align-items:start',
      bottomCss: 'margin-top:' + (m ? '32px' : '48px') + ';padding-top:22px;border-top:1px solid rgba(255,255,255,.14);display:'
        + (m ? 'flex;flex-direction:column;gap:18px' : 'flex;justify-content:space-between;gap:40px;align-items:flex-start'),
    };
  }
}

</script>
</body>
</html>
