  '— возможность посетить шоурум и вживую выбрать материалы;',
  '— планирование бюджета;',
  '— подбор решений под ваши задачи и образ жизни.',
];


const STEPS = [
  { title: 'Консультация', text: 'Вы можете посетить наш шоурум для встречи с нашим комплектатором, где мы согласовываем идеи и пожелания, формируем техническое задание и подписываем соответствующие документы для начала работы' },
  { title: 'Спецификация', text: 'Подбор материалов и составление спецификации в рамках бюджета.' },
  { title: 'Согласование материалов', text: 'Вносим необходимые правки в спецификацию, можем организовать выезд в шоурум, где можно будет увидеть материалы своими глазами и потрогать их.' },
  { title: 'Составление графика закупок', text: 'Составляем ориентировочный графика закупок и оплат' },
  { title: 'Закупка материалов', text: 'Мы самостоятельно закупаем материалы у производителей.' },
  { title: 'Доставка материалов', text: '' },
];


const PARTNERS = ['logo-09.png', 'logo-10.png', 'logo-11.jpg', 'logo-12.webp', 'logo-01.jpg', 'logo-02.jpg', 'logo-03.jpg', 'logo-04.jpg', 'logo-05.jpg', 'logo-06.jpg', 'logo-07.jpg', 'logo-08.jpg', 'logo-13.jpg', 'logo-14.png', 'logo-15.jpg'];
const PARTNER_NAMES = { 'logo-09.png': 'AM·PM', 'logo-10.png': 'Мосплитка', 'logo-11.jpg': 'Барклайн', 'logo-12.webp': 'Kerama Marazzi' };


class Component extends DCLogic {
  state = { pshift: 0, submissionMessage: '' };

  renderVals() {
    const mobile = !!this.props.mobile;
    const { pshift } = this.state;
    const per = mobile ? 2 : 4;
    const groups = Math.ceil(PARTNERS.length / per);
    const start = ((pshift % groups) + groups) % groups;
    return {
      headerVariant: mobile ? 'mobile' : 'default',
      isMobile: mobile,
      heroBullets: HERO_BULLETS,
      steps: STEPS.map((s, i) => ({ n: '0' + (i + 1), title: s.title, text: s.text })),
      submissionMessage: this.state.submissionMessage,
      noSubmit: (e) => { e.preventDefault(); this.setState({ submissionMessage: 'Спасибо! Это демонстрационная форма — данные не отправляются.' }); },
      partnersPrev: () => this.setState({ pshift: pshift - 1 }),
      partnersNext: () => this.setState({ pshift: pshift + 1 }),
      partners: Array.from({ length: per }, (_, i) => { const f = PARTNERS[(start * per + i) % PARTNERS.length]; return { src: 'assets/' + f, name: PARTNER_NAMES[f] || 'Логотип поставщика' }; }),
    };
  }
}

</script>
</body>
</html>
