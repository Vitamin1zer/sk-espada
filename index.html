<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Эспада — презентация нового сайта</title>
<link rel="icon" href="assets/logo-espada.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/demo.css">
<link rel="stylesheet" href="assets/presentation.css">
<script src="assets/demo.js" defer></script>
<script src="assets/routes.js" defer></script>
<script src="assets/presentation.js" defer></script>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <a class="sidebar__brand" href="#home" aria-label="Главная"><img src="assets/logo-full-white.png" alt="Эспада — ремонт и дизайн"></a>
  <div class="sidebar__label">Новый сайт</div>
  <nav id="page-list" aria-label="Макеты страниц"></nav>
  <div class="sidebar__foot"><span class="status-dot"></span>Редакция 27 ноября 2026</div>
</aside>
<main class="workspace">
  <header class="toolbar">
    <button class="icon-button" id="menu-toggle" type="button" aria-label="Список страниц" aria-controls="sidebar" aria-expanded="true">☰</button>
    <div class="toolbar__title"><strong id="page-title">Главная</strong><span>Презентация макетов</span></div>
    <div class="devices" role="group" aria-label="Размер экрана">
      <button type="button" data-device="desktop" aria-pressed="true">Компьютер</button>
      <button type="button" data-device="mobile" aria-pressed="false">Телефон</button>
    </div>
    <a class="icon-button open-page" id="open-page" target="_blank" rel="noopener" title="Открыть макет отдельно" aria-label="Открыть макет отдельно">↗</a>
  </header>
  <div class="variant-bar" id="variant-bar" hidden></div>
  <div class="stage" id="stage">
    <div class="artboard-box" id="artboard-box"><div class="artboard" id="artboard"><iframe id="preview" title="Главная" src="Главная.dc.html"></iframe></div></div>
  </div>
</main>
<noscript>Для просмотра интерактивных макетов включите JavaScript.</noscript>
</body>
</html>
