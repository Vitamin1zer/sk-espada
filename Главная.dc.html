const RESULT_PHOTOS = ["assets/main-carousel-01.jpg", "assets/main-carousel-02.jpg", "assets/main-carousel-03.jpg", "assets/main-carousel-04.jpg", "assets/main-carousel-05.jpg", "assets/main-carousel-06.jpg", "assets/main-carousel-07.jpg", "assets/main-carousel-08.jpg", "assets/main-carousel-09.jpg", "assets/main-carousel-10.jpg", "assets/main-carousel-11.jpg", "assets/main-carousel-12.jpg"];
function createResultCarousel(wrap, openPhoto) {
  if (!wrap) return null;
  const items = Array.from(wrap.querySelectorAll('.main-result-carousel__item'));
  if (!items.length) return null;
  let angle = 0, velocity = 0, dragging = false, moved = false, startX = 0, startAngle = 0, previousAngle = 0, raf = 0;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const render = () => {
    const radius = wrap.clientWidth > 960 ? 500 : wrap.clientWidth > 640 ? 370 : 270;
    items.forEach((item, i) => {
      const degrees = 360 / items.length * i + angle;
      const radians = degrees * Math.PI / 180;
      const cosine = Math.cos(radians);
      const scale = .38 + .62 * (cosine + 1) / 2;
      item.style.transform = 'translateX(' + (Math.sin(radians) * radius).toFixed(2) + 'px) translateZ(' + (cosine * radius).toFixed(2) + 'px) rotateY(' + (-degrees).toFixed(2) + 'deg) scale(' + scale.toFixed(4) + ')';
      item.style.opacity = cosine < -.2 ? '0' : '1';
      item.style.zIndex = String(Math.round((cosine + 1) * 50));
      item.style.pointerEvents = cosine < -.2 ? 'none' : 'auto';
      item.tabIndex = cosine < -.2 ? -1 : 0;
    });
  };
  const loop = () => {
    if (!dragging) {
      if (Math.abs(velocity) > .008) { angle += velocity; velocity *= .935; }
      else { velocity = 0; if (!reducedMotion) angle += .018; }
    }
    angle = (angle % 360 + 360) % 360;
    render();
    raf = requestAnimationFrame(loop);
  };
  const down = e => { if (e.button && e.button !== 0) return; dragging = true; moved = false; startX = e.clientX; startAngle = angle; previousAngle = angle; velocity = 0; wrap.classList.add('is-dragging'); };
  const move = e => { if (!dragging) return; const delta = e.clientX - startX; if (Math.abs(delta) > 4) moved = true; angle = startAngle + delta * .22; velocity = angle - previousAngle; previousAngle = angle; };
  const up = () => { dragging = false; wrap.classList.remove('is-dragging'); };
  const click = e => { if (moved) { moved = false; return; } const item = e.target.closest('.main-result-carousel__item'); if (item) openPhoto(item.querySelector('img').getAttribute('src')); };
  const key = e => { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; e.preventDefault(); angle += (e.key === 'ArrowLeft' ? 1 : -1) * 360 / items.length; velocity = 0; render(); };
  wrap.addEventListener('pointerdown', down); window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up); wrap.addEventListener('click', click); wrap.addEventListener('keydown', key);
  render(); raf = requestAnimationFrame(loop);
  return { destroy() { cancelAnimationFrame(raf); wrap.removeEventListener('pointerdown', down); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); wrap.removeEventListener('click', click); wrap.removeEventListener('keydown', key); } };
}

class Component extends DCLogic {
  componentDidMount() { this.resultCarousel = createResultCarousel(document.querySelector('.main-result-carousel'), src => this.setState({ resultPhoto: src })); }
  componentWillUnmount() { if (this.resultCarousel) this.resultCarousel.destroy(); }

  state = { resultPhoto: '', tab: 'novostroyka', faq: 0, pshift: 0, popup: false, quizPopup: false, storyPopup: false, requestSent: false, reviewTab: 0, expandedReviews: {}, worryShift: 0, modalTop: 24, modalHeight: 720 };

  modalPosition(event) {
    const target = event && event.currentTarget;
    const rect = target ? target.getBoundingClientRect() : { top: 24 };
    let scale = 1;
    let viewport = window.innerHeight;
    if (window.frameElement) {
      const frame = window.frameElement;
      scale = frame.getBoundingClientRect().width / frame.offsetWidth || 1;
      viewport = window.parent.innerHeight / scale;
    }
    return { modalTop: Math.max(0, window.scrollY), modalHeight: Math.min(900, viewport) };
  }

  renderVals() {
    const mobile = !!this.props.mobile;
    const { tab, faq, pshift, popup, quizPopup, storyPopup, requestSent, reviewTab, expandedReviews, worryShift } = this.state;

      worriesNext: (e) => e.currentTarget.closest('section').querySelector('.main-story-carousel').scrollBy({ left: 322, behavior: 'smooth' }),
      modalCss: '--main-local-top:' + this.state.modalTop + 'px;--main-local-height:' + this.state.modalHeight + 'px',

      closeQuiz: () => this.setState({ quizPopup: false }),
      openStory: (e) => this.setState(Object.assign({ storyPopup: true }, this.modalPosition(e))),
      closeStory: () => this.setState({ storyPopup: false }),
      openPopup: (e) => this.setState(Object.assign({ popup: true }, this.modalPosition(e))),
      closePopup: () => this.setState({ popup: false }),
      noSubmit: (e) => { e.preventDefault(); this.setState(Object.assign({ popup: false, requestSent: true }, this.modalPosition(e))); },
      partnersPrev: () => this.setState({ pshift: pshift - 1 }),
      partnersNext: () => this.setState({ pshift: pshift + 1 }),
      partners: PARTNERS.slice(start * per, start * per + per).map(f => 'assets/' + f),
      works: WORKS.map(w => ({
        title: w.title,

          + 'clip-path:polygon(0 0, calc(100% - 34px) 0, 100% 50%, calc(100% - 34px) 100%, 0 100%);'
          + 'margin-left:' + (mobile ? 0 : w.indent) + 'px;min-height:clamp(92px,8cqw,116px);align-items:center',
      })),
      tabs: [
        { key: 'novostroyka', label: 'Новостройка' },

      ].map(t => ({ label: t.label, go: () => this.setState({ tab: t.key }), css: tabBtn(tab === t.key) })),
      tariffs: TARIFFS[tab],
      faq: FAQ.map((f, i) => ({

        hasList: !!f.list,
        list: f.list || [],
      })),
    };
  }
}
