class Component extends DCLogic {
  state = { tab: 'novostroyka', seoOpen: false };

  renderVals() {
    const p = PAGE;
    const mobile = !!this.props.mobile;
    const { tab, seoOpen } = this.state;
    const tabBtn = active => 'border:1px solid #00AD9F;border-radius:5px;padding:14px 24px;font-size:clamp(11px,.95cqw,13px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .2s;background:'
      + (active ? '#00AD9F' : '#fff') + ';color:' + (active ? '#fff' : '#00AD9F');
    return {
      p, isMobile: mobile, headerVariant: mobile ? 'mobile' : 'default',
      heroImageCss: 'position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center;background-image:url("' + p.hero + '")',
      openPopup: () => window.__espadaOpenPopup({ kind: 'Попап', title: p.popupTitle, cta: p.cta1, perks: p.popupPerks }),
      tabs: [{ k: 'novostroyka', l: 'Новостройка' }, { k: 'vtorichka', l: 'Вторичка' }]
        .map(item => ({ label: item.l, go: () => this.setState({ tab: item.k }), css: tabBtn(tab === item.k) })),
      tariffs: tab === 'novostroyka' ? T_NOVOSTROYKA : T_VTORICHKA,
      portfolio: PORTFOLIO.map(work => ({ ...work, imageCss: 'width:100%;aspect-ratio:1/1;border-radius:5px;display:block;background-size:cover;background-position:center;background-image:url("' + work.img + '");transition:opacity .2s' })),
      seoParas: seoOpen ? p.seo : p.seo.slice(0, 2),
      seoFade: !seoOpen,
      seoLabel: seoOpen ? 'Свернуть' : 'Читать полностью',
      seoBoxCss: 'position:relative;overflow:hidden;max-height:' + (seoOpen ? 'none' : 'clamp(180px,17cqw,240px)'),
      toggleSeo: () => this.setState({ seoOpen: !seoOpen }),
    };
  }
}
