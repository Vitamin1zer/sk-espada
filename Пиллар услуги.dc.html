<helmet>






<style>

<div style="container-type:inline-size;position:relative;font-family:TildaSans,'Helvetica Neue',Helvetica,sans-serif;color:#313131;background:#fff;overflow:hidden">

  <dc-import name="Шапка" variant="{{ headerVariant }}" hint-size="100%,122px"></dc-import>

  <div style="background:#fff;border-bottom:1px solid #f0f0f0">

      <span style="font-size:12px;color:#bfbfbf">/</span>
      <span style="font-size:12px;color:#5c5c5c">{{ p.crumb }}</span>
    </div>
  </div>

  <section data-screen-label="Обложка пиллара" style="position:relative;background:#313131">

    </sc-if>

    <div style="position:relative;max-width:1200px;margin:0 auto;padding:clamp(40px,4.6cqw,74px) clamp(16px,1.4cqw,20px) clamp(44px,5cqw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,3cqw,44px);align-items:center;min-height:clamp(460px,36cqw,540px)">
      <div style="display:flex;flex-direction:column;gap:clamp(16px,1.6cqw,24px);min-width:0">
        <h1 style="margin:0;font-size:clamp(27px,3.9cqw,56px);line-height:1.02;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;color:#fff">{{ p.h1 }}</h1>

        <div style="font-size:clamp(13px,1.3cqw,18px);line-height:1.55;color:#fff;max-width:540px;display:flex;flex-direction:column;gap:4px">

        <sc-if value="{{ p.price }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:11px;color:#d9d9d9;letter-spacing:.02em">Цена «от» указана за квадратный метр по полу</div>
        </sc-if>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">

          <sc-if value="{{ p.cta2 }}" hint-placeholder-val="{{ true }}">

      </div>
      <div style="min-width:0;display:flex;justify-content:flex-end">

  <section data-screen-label="Вводный текст" style="background:#fff;padding:clamp(44px,5.6cqw,92px) 0 clamp(30px,3.4cqw,54px)">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,2.8cqw,48px);align-items:start">
      <div style="min-width:0;display:flex;flex-direction:column;gap:16px">

        <p style="margin:0;font-size:clamp(16px,1.4cqw,20px);line-height:1.65;color:#5c5c5c;max-width:560px;text-wrap:pretty">{{ p.lead }}</p>

            <div style="font-size:clamp(20px,2.1cqw,30px);font-weight:600;line-height:1;color:#00AD9F;font-variant-numeric:tabular-nums">{{ f.v }}</div>

        </sc-for>

      <div style="margin-top:clamp(26px,2.8cqw,42px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(16px,1.8cqw,26px);align-items:start">
        <sc-for list="{{ clusters }}" as="card" hint-placeholder-count="4">

              <div style="display:flex;flex-direction:column;gap:14px">

                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <sc-if value="{{ p.hasTariffs }}" hint-placeholder-val="{{ true }}">
    <section data-screen-label="Тарифы" style="background:#fff;padding:clamp(44px,5.6cqw,92px) 0">
      <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px)">
        <div style="display:flex;gap:clamp(14px,1.6cqw,26px);align-items:center;flex-wrap:wrap">
          <h2 style="margin:0;font-size:clamp(20px,2.2cqw,31px);line-height:1.1;font-weight:600;font-style:italic;letter-spacing:-.01em;text-transform:uppercase;color:#313131">{{ p.tariffTitle }}</h2>
          <sc-if value="{{ hasTabs }}" hint-placeholder-val="{{ true }}">

        </div>

              <div class="espada-tariff__box"><h3>{{ t.title }}</h3><div class="espada-tariff__price"><em>от {{ t.price }} ₽/м²</em><span>по полу</span></div><div class="espada-tariff__items"><sc-for list="{{ t.items }}" as="i"><div>{{ i }}</div></sc-for></div></div>

      </div>

  <section data-screen-label="Этапы работы" style="background:#f8f8f8;padding:clamp(44px,5.6cqw,92px) 0">

      <div style="margin-top:clamp(26px,2.8cqw,42px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(16px,1.7cqw,26px)">

      </div>

  <section data-screen-label="SEO-текст" style="background:#fff;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px);display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:clamp(28px,3cqw,42px);line-height:1.14;font-weight:600;letter-spacing:-.01em;text-transform:uppercase;color:#000">{{ p.seoTitle }}</h2>

        <sc-for list="{{ faq }}" as="f" hint-placeholder-count="5">

            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="Отзывы" hint-size="100%,900px"></dc-import>

      </div>
    </div>
  </section>

  <section data-screen-label="Контакты" style="background:#fff;padding:clamp(44px,5.6cqw,92px) 0">
    <div style="max-width:1200px;margin:0 auto;padding:0 clamp(16px,1.4cqw,20px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(24px,2.6cqw,44px);align-items:center">

        <div style="font-size:clamp(16px,1.4cqw,20px);line-height:1.6;color:#313131">г. Москва,<br /><a href="https://yandex.ru/maps/-/CLgmeD3e" target="_blank" rel="noopener" style="color:#00AD9F">ул. Дегунинская, д.1, корп.2</a></div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <h3 style="margin:0;font-size:clamp(14px,1.25cqw,18px);font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:#313131">Как добраться:</h3>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <a data-button-link="true" href="https://yandex.ru/maps/-/CLgmeD3e" target="_blank" rel="noopener" style="background:#00AD9F;color:#fff;padding:13px 22px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:background .2s" style-hover="background:#026B63;color:#fff">Яндекс.Карты</a>
            <a data-button-link="true" href="https://go.2gis.com/JknLA" target="_blank" rel="noopener" style="background:#00AD9F;color:#fff;padding:13px 22px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:background .2s" style-hover="background:#026B63;color:#fff">2.ГИС</a>
          </div>

function packCards(groups) {
  const cards = [];
  let cur = null;
  groups.forEach(g => {
    if (g.items.length >= 8) { cards.push([g]); cur = null; return; }
    const size = cur ? cur.reduce((s, x) => s + x.items.length, 0) : 0;
    if (cur && size + g.items.length <= 8) { cur.push(g); return; }
    cur = [g];
    cards.push(cur);
  });
  return cards;
}
