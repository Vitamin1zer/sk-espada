<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="espada-revision" content="20261127-grid">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=20261127-grid"></script>
<link rel="stylesheet" href="assets/demo.css?v=20261127-grid">
<script src="assets/demo.js?v=20261127-grid" defer></script>
</head>
<body>
<template data-dc-source><x-dc>
<helmet>
<style>
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:TildaSans;src:url("assets/fonts/TildaSans-ExtraBold.woff2") format("woff2");font-weight:800;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
a{color:#00AD9F;text-decoration:none}
a:not([data-button-link]):hover{color:#026B63}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
</style>
</helmet>

<div class="espada-quiz" style="{{ rootCss }}">

  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-bottom:2px">
      <h2 style="margin:0;min-width:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;color:#000">{{ title }}</h2>
    </div>
    <div style="height:4px;background:#e4e4e4;border-radius:5px;overflow:hidden">
      <div style="{{ barCss }}"></div>
    </div>

  </div>

  <sc-if value="{{ cards }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:18px">
      <h3 style="margin:0;font-size:20px;font-weight:600;color:#313131;line-height:1.3;text-align:center">{{ question }}</h3>
      <div style="{{ cardGridCss }}">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{ c.go }}" aria-label="{{ c.t }}" aria-pressed="{{ c.selected }}" style="{{ c.css }}" style-hover="border-color:#00AD9F;background:#f2fbfa;color:#313131">
            <sc-if value="{{ c.img }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="{{ c.t }}" style="{{ c.imageCss }}"></span></sc-if>
            <span style="font-size:16px;font-weight:400;line-height:1.25;color:inherit">{{ c.t }}</span>
            <sc-if value="{{ c.hint }}" hint-placeholder-val="{{ true }}">
              <span style="font-size:14px;line-height:1.4;color:inherit">{{ c.hint }}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:20px">
      <h3 style="margin:0;font-size:20px;font-weight:600;color:#313131;line-height:1.3;text-align:center">{{ question }}</h3>
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-size:clamp(30px,3cqw,44px);font-weight:800;line-height:1;color:#00AD9F;font-variant-numeric:tabular-nums">{{ area }}</span>
        <span style="font-size:15px;color:#5c5c5c">м²</span>
      </div>
      <input type="range" min="6" max="250" step="1" value="{{ area }}" onInput="{{ setArea }}" style="width:100%;accent-color:#00AD9F" />
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:#929292;font-variant-numeric:tabular-nums">
        <span>6 м²</span>
        <span>250 м²</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{ presets }}" as="pr" hint-placeholder-count="4">
          <button type="button" onClick="{{ pr.go }}" style="{{ pr.css }}" style-hover="border-color:#026B63;background:#026B63;color:#fff">{{ pr.t }}</button>
        </sc-for>
      </div>

    </div>
  </sc-if>

  <sc-if value="{{ isContacts }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:16px">
      <sc-if value="{{ contactTitle }}" hint-placeholder-val="{{ false }}"><h3 style="margin:0;font-size:24px;font-weight:600;line-height:1.25;text-align:center">{{ contactTitle }}</h3></sc-if>
      <p style="margin:0;font-size:20px;font-weight:400;color:#313131;line-height:1.3;text-align:center">{{ question }}</p>
      <div style="{{ summaryBoxCss }}"><span style="font-size:16px;font-weight:600">Ваши ответы</span><span style="font-size:16px;font-weight:400;line-height:1.5">{{ summary }}</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px">
        <sc-if value="{{ needsName }}" hint-placeholder-val="{{ true }}">
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:16px;font-weight:400;color:#5c5c5c">Имя</span>
          <input type="text" name="name" value="{{ name }}" onChange="{{ setName }}" autocomplete="given-name" placeholder="Иван" style="height:50px;border:1px solid #d9d9d9;border-radius:5px;padding:0 13px;font-size:18px;color:#313131;background:#fff;outline:none" style-focus="border-color:#00AD9F" />
        </label>
        </sc-if>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:16px;font-weight:400;color:#5c5c5c">Телефон</span>
          <input type="tel" name="phone" autocomplete="tel" value="{{ phone }}" onChange="{{ setPhone }}" placeholder="+7 (000) 000-00-00" style="height:50px;border:1px solid #d9d9d9;border-radius:5px;padding:0 13px;font-size:18px;color:#313131;background:#fff;outline:none" style-focus="border-color:#00AD9F" />
        </label>
      </div>
      <label style="display:flex;gap:9px;align-items:flex-start;min-height:44px;cursor:pointer">
        <input type="checkbox" name="consent" aria-label="Согласие на обработку персональных данных" checked="{{ consent }}" onChange="{{ setConsent }}" style="width:17px;height:17px;flex:0 0 17px;margin:2px 0 0;accent-color:#00AD9F" />
        <span style="font-size:13px;line-height:1.45;color:#5c5c5c">Я даю <a href="/soglasie-na-obrabotku/" style="color:#00AD9F;text-decoration:underline">согласие на обработку моих персональных данных</a> в соответствии с <a href="/politika-konfidencialnosti/" style="color:#00AD9F;text-decoration:underline">Политикой конфиденциальности</a></span>
      </label>
    </div>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center">
      <div role="status" style="border-radius:5px;background:#f2fbfa;color:#026B63;padding:12px 20px;font-size:16px;font-weight:600">Демонстрация завершена</div>
      <h3 style="margin:0;font-size:24px;font-weight:600;color:#313131;line-height:1.2">Вы заполнили запрос</h3>
      <p style="margin:0;font-size:16px;font-weight:400;line-height:1.5;color:#5c5c5c;max-width:520px">Это демонстрация: заявка не отправлялась. Ниже — выбранные вами ответы.</p>
      <div style="{{ summaryBoxCss }}"><span style="font-size:16px;font-weight:400;line-height:1.5">{{ summary }}</span></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px">
        <a data-button-link="true" href="/portfolio/" style="border-radius:5px;border:1px solid #00AD9F;background:#fff;color:#026B63;padding:14px 22px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,color .2s" style-hover="background:#026B63;border-color:#026B63;color:#fff">Смотреть работы</a>
        <button type="button" onClick="{{ reset }}" style="border-radius:5px;border:1px solid #d9d9d9;background:#fff;color:#5c5c5c;padding:14px 22px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,color .2s" style-hover="background:#f2fbfa;border-color:#026B63;color:#026B63">Пройти заново</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}"><div role="alert" style="padding:14px;border:1px solid #c0392b;border-radius:5px;color:#a5301f;background:#fdecea;font-size:14px;line-height:1.4">{{ error }}</div></sc-if>

  <sc-if value="{{ showNav }}" hint-placeholder-val="{{ true }}">
    <div style="{{ navCss }}">
      <span aria-live="polite" style="font-size:16px;font-weight:400;line-height:1.4;color:#313131;font-variant-numeric:tabular-nums;white-space:nowrap">{{ counter }}</span>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap">
      <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ back }}" style="border-radius:5px;border:1px solid #d9d9d9;background:transparent;color:#5c5c5c;padding:15px 22px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:all .2s" style-hover="border-color:#5c5c5c;color:#313131">Назад</button>
      </sc-if>
      <button type="button" onClick="{{ next }}" style="border-radius:5px;background:#00AD9F;color:#fff;border:0;padding:15px 26px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,box-shadow .2s" style-hover="background:#026B63;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.2)">{{ nextLabel }}</button>
      </div>
    </div>
  </sc-if>

</div>

</x-dc></template>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:620},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Ремонт&quot;,&quot;Дизайн-проект&quot;,&quot;Ремонт по стилю&quot;],&quot;default&quot;:&quot;Ремонт&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Квиз&quot;},&quot;startStep&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Квиз&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Квиз&quot;}}">
const C = (t, hint) => ({ t, hint: hint || '' });

const REMONT = {
  title: 'Расчёт стоимости ремонта',
  steps: [
    { key: 'Объект', q: 'Какой у вас объект?', cards: [C('Новостройка'), C('Вторичка'), C('Дом или коттедж'), C('Коммерческое помещение')] },
    { key: 'Состояние', q: 'В каком состоянии помещение?', cards: [C('Без отделки', 'бетон'), C('Предчистовая', 'white box'), C('С отделкой застройщика'), C('Жилая квартира')] },
    { key: 'Вид ремонта', q: 'Какой ремонт нужен?', dependsOn: 0, cardsBy: {
      'Новостройка': [C('Чистовой'), C('Черновой'), C('Под ключ'), C('Дизайнерский')],
      'Вторичка': [C('Косметический'), C('Капитальный'), C('Дизайнерский')],
    }, cards: [C('Косметический'), C('Чистовой'), C('Черновой'), C('Под ключ'), C('Капитальный'), C('Дизайнерский')] },
    { key: 'Площадь', q: 'Площадь помещения', area: true },
    { key: 'Проект', q: 'Есть дизайн-проект?', cards: [C('Есть готовый'), C('Нужен проект', 'выезд дизайнера бесплатно'), C('Обойдёмся без проекта')] },
    { key: 'Сроки', q: 'Когда планируете начать?', cards: [C('Сейчас'), C('В течение 1–3 месяцев'), C('Позже, пока считаю бюджет')] },
    { key: 'Контакты', q: 'Куда отправить расчёт?', contacts: true },
  ],
  presets: [40, 54, 78, 120],
  startArea: 54,
};

const DESIGN = {
  title: 'Расчёт стоимости дизайн-проекта',
  steps: [
    { key: 'Объект', q: 'Что проектируем?', cards: [C('Квартира'), C('Квартира-студия'), C('Дом или коттедж'), C('Офис или коммерция')] },
    { key: 'Объём', q: 'Проект на весь объект или на помещения?', cards: [C('Весь объект'), C('Отдельные помещения'), C('Пока не решили')] },
    { key: 'Пакет', q: 'Какой пакет ближе?', cards: [C('Технический'), C('Стандартный'), C('Полный'), C('Авторский')] },
    { key: 'Площадь', q: 'Площадь объекта', area: true },
    { key: 'Стиль', q: 'Есть предпочтения по стилю?', cards: [C('Современный'), C('Классика'), C('Минимализм'), C('Ещё не определились')] },
    { key: 'Комплектация', q: 'Нужна комплектация материалами?', cards: [C('Да, под ключ'), C('Только материалы отделки'), C('Не нужна'), C('Обсудим на встрече')] },
    { key: 'Контакты', q: 'Куда отправить расчёт?', contacts: true },
  ],
  presets: [14, 40, 65, 95],
  startArea: 54,
};

const STYLE = {
  title: 'Рассчитайте стоимость дизайна',
  contactTitle: 'Ваш расчёт готов!',
  steps: [
    { key: 'Тона', q: 'Какие тона в интерьере вы предпочитаете?', cards: [
      { ...C('Светлые'), img: 'assets/quiz-style-01.jpg' }, { ...C('Что-то среднее'), img: 'assets/quiz-style-02.jpg' }, { ...C('Темные'), img: 'assets/quiz-style-03.jpg' },
    ] },
    { key: 'Интерьер', q: 'Каким вы представляете свой интерьер?', cards: [
      { ...C('Классический интерьер'), img: 'assets/quiz-style-04.jpg' }, { ...C('Что-то среднее'), img: 'assets/quiz-style-05.jpg' }, { ...C('Современный интерьер'), img: 'assets/quiz-style-06.jpg' },
    ] },
    { key: 'Площадь', q: 'Какая площадь вашего жилья?', cards: [C('До 20 м²'), C('До 40 м²'), C('До 60 м²'), C('До 80 м²'), C('До 100 м²'), C('Больше 100 м²')] },
    { key: 'Подбор', q: 'Нужен ли вам будет подбор отделочных материалов или мебели?', cards: [C('Да, нужен'), C('Не знаю'), C('Нет, не нужно')] },
    { key: 'Декор', q: 'Сколько декора в интерьере предпочитаете?', cards: [
      { ...C('Лучше побольше'), img: 'assets/quiz-style-07.jpg' }, { ...C('Что-то среднее'), img: 'assets/quiz-style-08.jpg' }, { ...C('Лучше поменьше'), img: 'assets/quiz-style-09.jpg' },
    ] },
    { key: 'Контакты', q: 'На какой номер отправить стоимость вашего дизайна?', contacts: true },
  ],
  presets: [], startArea: 54, style: true,
};
const KINDS = { 'Ремонт': REMONT, 'Дизайн-проект': DESIGN, 'Ремонт по стилю': STYLE, repair: REMONT, design: DESIGN, style: STYLE };

class Component extends DCLogic {
  state = { step: null, pick: {}, area: null, name: '', phone: '', consent: false, error: '' };


  renderVals() {
    const requested = new URLSearchParams(window.location.search).get('kind') || this.props.kind;
    const q = KINDS[requested] || REMONT;
    const total = q.steps.length;
    const seed = typeof this.props.startStep === 'number' ? this.props.startStep : 0;
    const step = Math.max(0, Math.min(total, this.state.step === null ? seed : this.state.step));
    const pick = this.state.pick;
    const area = this.state.area === null ? q.startArea : this.state.area;
    const done = step >= total;
    const cur = q.steps[Math.min(step, total - 1)];
    const curCards = cur && cur.cardsBy
      ? (cur.cardsBy[pick[cur.dependsOn]] || cur.cards)
      : (cur ? cur.cards : null);

    const picked = q.steps
      .map((s, i) => (pick[i] ? s.key + ': ' + pick[i] : null))
      .filter(Boolean);
    const summary = picked.length
      ? picked.join(' · ') + (q.style ? '' : ' · Площадь: ' + area + ' м²')
      : (q.style ? 'Ответьте на вопросы, чтобы подобрать интерьер' : 'Площадь: ' + area + ' м²');

    const boxBg = this.props.tone === 'dark' ? '#f8f8f8' : '#f8f8f8';

    return {
      title: q.title,
      contactTitle: q.contactTitle || '',
      needsName: true,
      name: this.state.name, phone: this.state.phone, consent: this.state.consent, error: this.state.error,
      setName: (e) => this.setState({ name: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setConsent: (e) => this.setState({ consent: e.target.checked }),
      question: done ? '' : cur.q,
      counter: done ? 'Готово' : 'Шаг № ' + (step + 1) + ' из ' + total,
      rootCss: 'container-type:inline-size;font-family:TildaSans,\'Helvetica Neue\',Helvetica,sans-serif;color:#313131;background:'
        + (this.props.tone === 'dark' ? '#f8f8f8' : '#fff')
        + ';border-radius:5px;padding:clamp(22px,2.5cqw,40px);display:flex;flex-direction:column;gap:clamp(20px,2.2cqw,30px)',
      barCss: 'height:100%;border-radius:5px;background:#00AD9F;transition:width .3s cubic-bezier(.4,0,.2,1);width:'
        + Math.round(((done ? total : step) / total) * 100) + '%',
      summaryBoxCss: 'background:' + (this.props.tone === 'dark' ? '#fff' : boxBg)
        + ';border-radius:5px;padding:18px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left',
      navCss: 'display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:8px',
      cardGridCss: (q.style ? 'display:flex;flex-wrap:wrap;justify-content:center' : 'display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))')
        + ';gap:12px;align-self:center;width:100%;max-width:720px',

      cards: !done && curCards ? curCards.map(c => ({
        t: c.t, hint: c.hint, img: c.img || null, selected: pick[step] === c.t,
        imageCss: c.img ? 'width:100%;aspect-ratio:1/1;border-radius:5px;display:block;background-size:cover;background-position:center;background-image:url("' + c.img + '")' : '',
        go: () => this.setState({ pick: { ...Object.fromEntries(Object.entries(pick).filter(([i]) => Number(i) < step)), [step]: c.t }, step: step + 1, error: '' }),
        css: 'border:1px solid ' + (pick[step] === c.t ? '#00AD9F' : '#d9d9d9')
          + ';background:' + (pick[step] === c.t ? '#f2fbfa' : '#fff')
          + (q.style ? ';flex:1 1 140px;max-width:max(140px,calc((100% - 24px)/3))' : '')
          + ';color:#313131;border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center;transition:all .15s',
      })) : null,

      isArea: !done && !!cur.area,
      isContacts: !done && !!cur.contacts,
      isDone: done,
      showNav: !done,
      canBack: step > 0,
      nextLabel: !done && cur.contacts ? (q.style ? 'Узнать результат' : 'Получить расчёт') : 'Следующий шаг',
      back: () => this.setState({ step: Math.max(0, step - 1), error: '' }),
      next: () => {
        if (cur.contacts) {
          const phone = this.state.phone.replace(/\D/g, '');
          if (!this.state.name.trim() || phone.length !== 11 || !/^[78]/.test(phone) || !this.state.consent) {
            this.setState({ error: 'Укажите имя, полный номер телефона и согласие на обработку персональных данных.' });
            return;
          }
        } else if (curCards && !pick[step]) {
          this.setState({ error: 'Выберите один из вариантов ответа.' });
          return;
        }
        this.setState({ step: step + 1, error: '' });
      },
      reset: () => this.setState({ step: 0, pick: {}, area: null, name: '', phone: '', consent: false, error: '' }),

      area,
      setArea: (e) => this.setState({ area: Math.max(6, Math.min(250, Number(e.target.value) || 6)) }),
      presets: q.presets.map(v => ({
        t: v + ' м²',
        go: () => this.setState({ area: v }),
        css: 'border:1px solid ' + (area === v ? '#00AD9F' : '#e2e2e2') + ';background:'
          + (area === v ? '#00AD9F' : 'transparent') + ';color:' + (area === v ? '#fff' : '#5c5c5c')
          + ';border-radius:5px;padding:9px 14px;font-size:16px;font-weight:600;transition:all .15s',
      })),

      summary,
    };
  }
}

</script>
</body>
</html>
