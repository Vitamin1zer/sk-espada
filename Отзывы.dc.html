<!DOCTYPE html><html lang="ru"><head>
<meta name="espada-revision" content="20261127-review2"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Отзывы — Эспада</title><link rel="stylesheet" href="assets/demo.css?v=20261127-review2"><script src="support.js?v=20261127-review2"></script><script src="assets/demo.js?v=20261127-review2" defer></script></head><body><template data-dc-source><x-dc><helmet><style>@font-face{font-family:TildaSans;src:url('assets/fonts/TildaSans-Regular.woff2');font-weight:400;font-display:swap}@font-face{font-family:TildaSans;src:url('assets/fonts/TildaSans-Semibold.woff2');font-weight:600;font-display:swap}*{box-sizing:border-box}body{margin:0}.espada-reviews{font-family:TildaSans,sans-serif;color:#313131}.reviews-section{padding:72px 0}.reviews-container{max-width:1200px;margin:auto;padding:0 20px}.espada-reviews h2{font-size:42px;font-weight:600;line-height:1.15;text-align:center;margin:0 0 24px}.espada-reviews h3{font-size:20px;font-weight:600}.espada-reviews p{font-size:18px;line-height:1.5}.reviews-center{text-align:center}.main-review-tabs{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:32px 0}.main-review-tabs button{font:400 18px TildaSans,sans-serif;background:#f6f6f6;color:#313131;border:0;padding:12px 20px;border-radius:5px;min-height:48px;cursor:pointer}.main-review-tabs button:hover,.main-review-tabs .is-active{background:#01ad9f;color:#fff}.main-review-cards{display:flex;flex-direction:column;gap:18px;max-width:1000px;margin:auto}.main-review-card{padding:28px;border-radius:5px;background:#f6f6f6}.main-review-person{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.main-review-person>img:first-child{width:46px;height:46px;border-radius:50%;object-fit:cover}.main-review-person h3{margin:0;font-size:20px;font-weight:600}.main-review-person>div>span:not(.sc-interp){font-size:13px;color:#929292}.main-review-stars{width:110px;height:20px;object-fit:contain;margin-left:auto}.main-review-card p{margin:18px 0 8px}.main-review-card button{background:none;border:0;padding:8px 0;min-height:44px;font:400 16px TildaSans,sans-serif;color:#00ad9f;text-decoration:underline;cursor:pointer}.main-review-avatar{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#e0efec;color:#026b63}.main-review-pending{text-align:center;padding:32px;border-radius:5px;background:#f6f6f6}.main-zoon-icon{font-size:35px;color:#7354cd}.main-review-source{display:table;margin:24px auto 0;color:#00ad9f;font-size:18px}@media(max-width:640px){.reviews-section{padding:44px 0}.reviews-container{padding:0 16px}.espada-reviews h2{font-size:28px}.main-review-cards{grid-template-columns:minmax(0,1fr)}.main-review-card{padding:22px}.espada-reviews p{font-size:16px}.main-review-tabs{gap:8px}.main-review-tabs button{font-size:16px}}</style></helmet><div class="espada-reviews">  <section data-screen-label="Отзывы" class="reviews-section main-reviews">
    <div class="reviews-container"><h2>Посмотрите что говорят о нас клиенты</h2><p class="reviews-center main-review-intro">Все представленные отзывы достоверны и могут быть проверены вами лично.</p>
      <div class="main-review-tabs" role="tablist" aria-label="Площадки с отзывами"><sc-for list="{{ reviewTabs }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.active }}" onClick="{{ t.go }}" class="{{ t.className }}">{{ t.label }}</button></sc-for></div>
      <div class="main-review-cards"><sc-for list="{{ reviews }}" as="r" hint-placeholder-count="3"><article class="main-review-card"><div class="main-review-person"><sc-if value="{{ r.hasAvatar }}" hint-placeholder-val="{{ true }}"><img src="{{ r.avatar }}" alt="{{ r.name }}" /></sc-if><sc-if value="{{ r.noAvatar }}" hint-placeholder-val="{{ false }}"><span class="main-review-avatar" aria-label="{{ r.name }}">{{ r.initials }}</span></sc-if><div><h3>{{ r.name }}</h3><span>{{ r.date }}</span></div><sc-if value="{{ r.hasRating }}" hint-placeholder-val="{{ true }}"><img class="main-review-stars" src="assets/stars.svg" alt="Оценка 5 из 5" /></sc-if></div><p>{{ r.text }}</p><sc-if value="{{ r.canExpand }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ r.toggle }}">{{ r.moreLabel }}</button></sc-if></article></sc-for></div>
      <sc-if value="{{ reviewPending }}" hint-placeholder-val="{{ false }}"><div class="main-review-pending"><span class="main-zoon-icon" aria-hidden="true">Z</span><h3>Отзывы на Zoon</h3><p>Карточка площадки будет добавлена после подтверждения</p></div></sc-if><sc-if value="{{ hasReviewUrl }}" hint-placeholder-val="{{ true }}"><a class="main-review-source" href="{{ reviewUrl }}" target="_blank" rel="noopener">Открыть {{ reviewSource }} <span aria-hidden="true">↗</span></a></sc-if>
    </div>
  </section></div></x-dc></template><script type="text/x-dc" data-dc-script>const REVIEWS = [
  { name: 'Татьяна', avatar: 'assets/av-tatyana.svg', source: 'Яндекс.Карты', offset: 0,
    text: 'Хочу выразить огромную благодарность Кириллу и всей его команде. Я проживаю в Республике Коми. Дочери купили небольшую студию в г. Москве. Не пришлось ни о чём позаботиться, кроме Доверенности. Одним днём и без моего присутствия получили ключи и рассчитали стоимость ремонта. Через два месяца прилетела уже в полностью отремонтированную и обставленную мебелью квартиру. Никаких забот и хлопот. Каждый шаг по ремонту присылали по фото и видео. Цены вполне лояльные. Так держать!' },
  { name: 'Давид Самарский', avatar: 'assets/rev-1.jpg', source: 'Яндекс.Карты', offset: -24,
    text: 'Ремонт прошел без лишних хлопот для меня. Общение было через группу в мессенджере, оплата — онлайн по выставляемым счетам. Мне было удобно, потому что особо из-за работы нет времени контролировать каждый шаг. Смета составлялась и согласовывалась заранее, каких-то существенных выходов за границы не было. Понравилось, что ребята не просто формально делают то, что заложено в проекте, а предлагают изменения, которые существенно улучшают результат. Отдельное спасибо хочу сказать инженеру Антону, все грамотно рассчитал, рассказал и был очень внимателен по ходу общения. Хочу еще сказать про прораба, спасибо ему за его ответственность и внимательность к каждому этапу работ. Компания небольшая, всегда на связи, готовы ответить на вопросы и предложить наилучшие решения. Ремонтом доволен!' },
];
const MAIN_ARCHIVED_THIRD = {"name": "Виктория Третьюхина", "avatar": "assets/main-review-viktoria.png", "text": "Ремонт делали для моих сестер в девушке на Рязанке. Я почти ничего не понимаю в ремонте, поэтому боялась, что придется самой разбираться в материалах и технологиях. Наш прораб Алексей очень адекватный и конкретный, идёт по смете, доставки все взял на себя и заранее предупреждал, когда требовалось наше решение. Я волновалась, но процесс оказался хорошо организован. По итогу результатом довольны, спасибо!"};
class Component extends DCLogic {state={reviewTab:0,expandedReviews:{}};renderVals(){const {reviewTab,expandedReviews}=this.state;return{      reviewTabs: ['Яндекс.Карты','2ГИС','Zoon'].map((label,i) => ({ label, active: reviewTab === i, go: () => this.setState({ reviewTab: i }), className: reviewTab === i ? 'main-review-tab is-active' : 'main-review-tab' })),
      reviewSource: ['Яндекс.Карты','2ГИС','Zoon'][reviewTab],
      reviewUrl: ['https://yandex.com/maps/org/espada/170798264657/reviews/','https://2gis.ru/moscow/firm/70000001110641291/tab/reviews',''][reviewTab],
      hasReviewUrl: reviewTab !== 2,
      reviewPending: reviewTab === 2,
      reviews: (reviewTab === 0 ? [Object.assign({},REVIEWS[0],{date:'22 апреля',rating:5}),Object.assign({},REVIEWS[1],{date:'7 февраля',rating:5})] : reviewTab === 1 ? [Object.assign({},MAIN_ARCHIVED_THIRD,{rating:5}),{name:'Кирилл Николаев',initials:'КН',text:'Делали ремонт во вторичке. Александр прораб, отличный спец! Полностью заменили проводку, сантехнику, отопление.'}] : []).map((r,i) => {
        const key = reviewTab + ':' + i;
        const expanded = !!expandedReviews[key];
        return { name:r.name, avatar:r.avatar || '', hasAvatar:!!r.avatar, noAvatar:!r.avatar, initials:r.initials || '', hasRating:r.rating===5, date:r.date || '', canExpand:r.text.length>220,
          text: expanded || r.text.length<=220 ? r.text : r.text.slice(0,220) + '…',
          moreLabel: expanded ? 'Свернуть' : 'Читать дальше',
          toggle: () => this.setState({ expandedReviews:Object.assign({},expandedReviews,{[key]:!expanded}) })
        };
      }),
    };
  }
}
</script></body></html>
